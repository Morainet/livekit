name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 新推送自动取消同分支上仍在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :livekit:testDebugUnitTest

      - name: Assemble library (release AAR)
        run: ./gradlew :livekit:assembleRelease

      - name: Assemble demo (debug + minified release)
        run: ./gradlew :demo:assembleDebug :demo:assembleRelease

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: livekit/build/reports/tests/testDebugUnitTest

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: livekit-aar
          path: livekit/build/outputs/aar/*.aar
