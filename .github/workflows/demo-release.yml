name: Demo APK

# 打 demo-v* tag 触发（如 demo-v1.0.0），构建 demo APK 并发布到 GitHub Releases。
# 与 SDK 发版（release.yml，打 v* tag）解耦，便于单独分发示例 App。
on:
  push:
    tags: [ 'demo-v*' ]

permissions:
  contents: write   # 创建 GitHub Release 需要 write 权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble demo APK (debug + release)
        run: ./gradlew :demo:assembleDebug :demo:assembleRelease

      # 重命名为带版本号的文件名，便于在 Releases 页区分。
      - name: Rename APKs with tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p artifacts
          # AGP 默认输出 <module>-<variant>.apk，用通配符兜住可能的命名差异。
          cp demo/build/outputs/apk/debug/*-debug.apk "artifacts/livekit-demo-${TAG}-debug.apk"
          cp demo/build/outputs/apk/release/*-release.apk "artifacts/livekit-demo-${TAG}-release.apk"
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Demo ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.apk
